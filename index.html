<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>橋中二年級：老街極速對決</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2b;color:white;font-family:system-ui,'Noto Sans TC',sans-serif;overflow:hidden;touch-action:none}#game{display:block;width:100vw;height:100dvh}#panel{position:absolute;inset:0;background:linear-gradient(135deg,#172c46ef,#0a1525f5);display:flex;align-items:center;justify-content:center;z-index:3}#setup{width:min(94vw,680px);text-align:center}h1{font-size:clamp(24px,5vw,42px);margin:10px}p{color:#d3e6ff}select,button{font-size:19px;border:0;border-radius:14px;padding:12px 18px;margin:6px;background:#f6cf64;color:#1d2533;font-weight:800}select{background:white}.controls{position:absolute;bottom:15px;left:0;width:100%;display:none;justify-content:space-between;padding:0 2vw;pointer-events:none}.player{display:flex;gap:10px;pointer-events:auto}.ctl{width:clamp(65px,11vw,125px);height:clamp(62px,15vh,110px);border-radius:18px;background:#ffffffaa;border:2px solid white;font-size:clamp(20px,3vw,34px);touch-action:none;user-select:none}.ctl:active,.ctl.pressed{background:#ffd45c}.hud{position:absolute;top:8px;left:0;right:0;display:none;justify-content:space-between;padding:0 3%;font-weight:800;text-shadow:0 2px 4px #000;font-size:clamp(15px,2vw,24px);pointer-events:none}.tag{background:#13283cc9;border-radius:10px;padding:7px 12px}.help{font-size:13px;color:#d3e6ff}#restart{position:absolute;top:54px;right:3%;display:none;font-size:14px;padding:7px 12px}#result{font-size:clamp(22px,4vw,38px);color:#ffe082;min-height:48px}@media(orientation:portrait){#setup:after{content:'建議將 iPad 轉為橫向遊玩';display:block;color:#ffe082;margin-top:12px}}</style></head><body><canvas id="game"></canvas><div class="hud" id="hud"><span class="tag" id="h1"></span><span class="tag" id="clock">🏁 0%</span><span class="tag" id="h2"></span></div><button id="restart">重新選班</button><div class="controls" id="controls"><div class="player"><button class="ctl" data-k="a">◀</button><button class="ctl" data-k="d">▶</button><button class="ctl" data-k="w">⚡</button></div><div class="player"><button class="ctl" data-k="ArrowLeft">◀</button><button class="ctl" data-k="ArrowRight">▶</button><button class="ctl" data-k="ArrowUp">⚡</button></div></div><div id="panel"><div id="setup"><div style="font-size:45px">🏎️ 🏁 🏎️</div><h1>橋中二年級：老街極速對決</h1><p>橋頭老街・201～210 班・雙人競速</p><div><label>左側車隊 <select id="s1"></select></label><label>右側車隊 <select id="s2"></select></label></div><button id="start">開始對決！</button><div id="result"></div><p class="help">左邊玩家：◀ ▶ 轉向、⚡ 加速｜右邊玩家：◀ ▶ 轉向、⚡ 加速<br>閃避路障、收集甘蔗能量，率先完成賽程獲勝！</p></div></div><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const colors=['#f44','#ff9d00','#f6e44a','#31d67c','#29aaf0','#9865ee','#ef64ae','#13d3d3','#eee','#a66a3d'];for(let i=201;i<=210;i++){for(const id of ['s1','s2']){let o=document.createElement('option');o.value=i;o.textContent=i+' 班';document.getElementById(id).append(o)}}document.getElementById('s2').value='202';let keys={},players=[],running=false,finish=false,last=0,obstacles=[],distance=0,winning='';const length=3600;function makePlayers(){players=[{cls:+s1.value,x:-.5,progress:0,speed:0,boost:100,hits:0},{cls:+s2.value,x:.5,progress:0,speed:0,boost:100,hits:0}]}function start(){if(s1.value===s2.value){result.textContent='請選擇不同班級！';return}result.textContent='';makePlayers();obstacles=[];for(let i=0;i<36;i++){obstacles.push({at:180+i*100,lane:(Math.random()-.5)*1.5,type:i%4===0?'cane':'barrier',hit:[false,false]})}distance=0;running=true;finish=false;panel.style.display='none';controls.style.display='flex';hud.style.display='flex';restart.style.display='block';last=performance.now();requestAnimationFrame(loop)}document.getElementById('start').onclick=start;restart.onclick=()=>{running=false;panel.style.display='flex';controls.style.display='none';hud.style.display='none';restart.style.display='none';result.textContent=''};document.querySelectorAll('.ctl').forEach(b=>{const k=b.dataset.k;for(const ev of ['pointerdown','pointerup','pointercancel','pointerleave'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=ev==='pointerdown';b.classList.toggle('pressed',keys[k]);if(ev==='pointerdown')b.setPointerCapture(e.pointerId)})});addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);function car(x,y,c,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor='#0008';ctx.shadowBlur=9;ctx.fillStyle='#111';ctx.fillRect(-18,-23,8,22);ctx.fillRect(10,-23,8,22);ctx.fillRect(-18,16,8,22);ctx.fillRect(10,16,8,22);ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(-16,-35,32,70,9);ctx.fill();ctx.fillStyle='#142b46';ctx.fillRect(-12,-17,24,19);ctx.fillStyle='#fff9';ctx.fillRect(-10,16,20,5);ctx.restore()}function drawStreet(){ctx.fillStyle='#8bd0ed';ctx.fillRect(0,0,W,H);const horizon=H*.2;ctx.fillStyle='#f5dfb5';ctx.fillRect(0,horizon,W,H-horizon);for(let side of [-1,1])for(let i=0;i<7;i++){let x=side<0?i*W*.07:W-(i+1)*W*.07;let h=H*(.13+(i%3)*.035);ctx.fillStyle=['#a95c42','#e9b775','#b88c6d'][i%3];ctx.fillRect(x,horizon-h,W*.075,h);ctx.fillStyle='#5d332d';ctx.fillRect(x,horizon-h,W*.075,8);ctx.fillStyle='#43372c';ctx.fillRect(x+8,horizon-h+22,W*.035,17)}ctx.fillStyle='#55606b';ctx.beginPath();ctx.moveTo(W*.37,horizon);ctx.lineTo(W*.63,horizon);ctx.lineTo(W*.93,H);ctx.lineTo(W*.07,H);ctx.fill();ctx.strokeStyle='#fff6';ctx.lineWidth=4;for(let lane of [-.5,.5])for(let j=0;j<9;j++){let z=((j*130-distance*.7)%1100+1100)%1100/1100;let y=horizon+(H-horizon)*z*z;let width=W*(.13+.37*z);let x=W/2+lane*width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+8+z*24);ctx.stroke()}ctx.fillStyle='#f8e8a0';ctx.font=`bold ${Math.max(15,W*.021)}px sans-serif`;ctx.textAlign='center';ctx.fillText('橋 頭 老 街 ・ 二 年 級 班 際 盃',W/2,Math.max(25,horizon-15))}function drawObjects(){let base=Math.min(...players.map(p=>p.progress));for(const o of obstacles){let delta=o.at-base;if(delta<0||delta>550)continue;let t=1-delta/550;let y=H*.2+(H*.68)*t*t;let roadWidth=W*(.13+.37*t);let x=W/2+o.lane*roadWidth*.52;let size=9+t*24;ctx.font=`${size}px sans-serif`;ctx.textAlign='center';ctx.fillText(o.type==='cane'?'🌿':'🚧',x,y)}}function update(dt){players.forEach((p,i)=>{let left=keys[i?'ArrowLeft':'a'],right=keys[i?'ArrowRight':'d'],boost=keys[i?'ArrowUp':'w'];p.x+=((right?1:0)-(left?1:0))*dt*1.3;p.x=Math.max(-.82,Math.min(.82,p.x));let target=boost&&p.boost>0?255:175;p.speed+=(target-p.speed)*Math.min(1,dt*2.8);p.boost=Math.max(0,Math.min(100,p.boost+(boost?-27:12)*dt));p.progress+=p.speed*dt;for(const o of obstacles){if(o.hit[i]||Math.abs(o.at-p.progress)>15||Math.abs(o.lane-p.x)>0.26)continue;o.hit[i]=true;if(o.type==='cane')p.boost=Math.min(100,p.boost+38);else{p.progress=Math.max(0,p.progress-35);p.speed=45;p.hits++}}if(p.progress>=length&&!finish){finish=true;winning=p.cls+' 班勝利！🏆';running=false;setTimeout(()=>{panel.style.display='flex';controls.style.display='none';hud.style.display='none';restart.style.display='none';result.textContent=winning},650)}})}function draw(){drawStreet();drawObjects();players.forEach((p,i)=>{let center=i===0?W*.3:W*.7;let x=center+p.x*W*.15;let y=H*.69;car(x,y,colors[p.cls-201],Math.max(.8,Math.min(1.3,W/900)));ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(16,W*.025)}px sans-serif`;ctx.fillText(p.cls+'班',x,y-52);ctx.fillStyle='#1a2938';ctx.fillRect(center-W*.11,H*.81,W*.22,11);ctx.fillStyle=colors[p.cls-201];ctx.fillRect(center-W*.11,H*.81,W*.22*Math.min(1,p.progress/length),11)});h1.textContent=`🔴 ${players[0].cls}班　⚡${Math.round(players[0].boost)}%`;h2.textContent=`🔵 ${players[1].cls}班　⚡${Math.round(players[1].boost)}%`;clock.textContent=`🏁 ${Math.round(Math.max(...players.map(p=>p.progress))/length*100)}%`}function loop(now){if(!running)return;let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}drawStreet();
</script></body></html>
